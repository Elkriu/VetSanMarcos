server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webflux:
          default-filters:
            - DedupeResponseHeader=Access-Control-Allow-Credentials Access-Control-Allow-Origin
          globalcors:
            cors-configurations:
              '[/**]':
                allowedOrigins:
                  - "http://localhost:5173"
                allowedMethods:
                  - GET
                  - POST
                  - PUT
                  - PATCH
                  - DELETE
                  - OPTIONS
                allowedHeaders: "*"
          routes:
            - id: usuarios-route
              uri: lb://usuarios
              predicates:
                - Path=/auth/**, /usuarios/**

            - id: contacto-route
              uri: lb://contacto
              predicates:
                - Path=/mensajes/**

            - id: citas-route
              uri: lb://citas
              predicates:
                - Path=/citas/**

            - id: inventario-route
              uri: lb://inventario
              predicates:
                - Path=/productos/**

            - id: ventas-route
              uri: lb://ventas
              predicates:
                - Path=/boletas/**

            - id: pagos-route
              uri: lb://pagos
              predicates:
                - Path=/pagos/**

            - id: dashboard-route
              uri: lb://dashboard
              predicates:
                - Path=/dashboard/**

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/